<!--
  Үзэлтийн тоо (GoatCounter) — бүх хуудсанд _quarto.yml-ээр орно.
  GoatCounter-ийн код солих бол доорх GC_CODE-г өөрчилнө.

  Хэрэглээ (HTML дотор):
    <span class="vc" data-vc-href="methods/anova.html"></span>   → тухайн хуудасны үзэлт
    <span class="vc" data-vc-href=""></span>                     → одоогийн хуудасны үзэлт
    <span class="vc" data-vc-event="cs-01-open"></span>          → товч дарсан тоо (event)
    <a data-goatcounter-click="cs-01-open" ...>                  → дарахад event бүртгэнэ
-->
<script>
(function () {
  var GC_CODE = "serod";
  var GC = "https://" + GC_CODE + ".goatcounter.com";

  // /x/ → /x/index.html, /x/page → /x/page.html  (нэг хуудас нэг л замаар тоологдоно)
  function norm(p) {
    p = p.split("?")[0].split("#")[0];
    if (p.slice(-1) === "/") p += "index.html";
    else if (!/\.[a-z0-9]+$/i.test(p)) p += ".html";
    return p;
  }
  window.goatcounter = { path: function (p) { return norm(p); } };

  function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n < 1e7 ? 1 : 0).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function fetchCount(path) {
    return fetch(GC + "/counter/" + encodeURIComponent(path) + ".json")
      .then(function (r) { return r.ok ? r.json() : { count: "0" }; })
      .then(function (d) { return parseInt(String(d.count).replace(/[^0-9]/g, ""), 10) || 0; })
      .catch(function () { return null; });
  }

  function run() {
    document.querySelectorAll(".vc").forEach(function (el) {
      var path;
      if (el.hasAttribute("data-vc-event")) path = el.getAttribute("data-vc-event");
      else path = norm(new URL(el.getAttribute("data-vc-href") || location.pathname, location.href).pathname);
      var icon = el.getAttribute("data-vc-icon") || "bi-eye";
      var label = el.getAttribute("data-vc-label") || "үзсэн";
      el.innerHTML = '<i class="bi ' + icon + '"></i> <b>…</b> ' + label;
      fetchCount(path).then(function (n) {
        if (n === null) { el.style.display = "none"; return; }
        el.querySelector("b").textContent = fmt(n);
        el.title = n.toLocaleString("en-US") + " " + label;
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>
<script data-goatcounter="https://serod.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
  .vc { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.82rem; color: #64748b; white-space: nowrap; }
  .vc b { font-weight: 600; color: #334155; }
  .vc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.9rem; margin-top: 0.6rem; }
</style>
